name: dorian revalidate
description: >-
  Re-check warranted claims touched by a pull request, post the result as a
  sticky PR comment, and gate the check on the revalidation verdict.
  Composite, stdlib-only: no third-party actions; requires the gh CLI
  (preinstalled on GitHub-hosted runners) and a full-history checkout
  (actions/checkout with fetch-depth: 0).

inputs:
  fail_on:
    description: >-
      When to fail the step: 'revoked' (fail only on exit 4), 'degraded'
      (fail on exits 3 or 4), or 'never' (always succeed). Usage/infra
      failures (exits 2 and 5) fail the step regardless of this setting,
      except under 'never' — see action/README.md.
    required: false
    default: revoked
  base:
    description: >-
      Git ref to revalidate against (passed to `dorian revalidate --since`).
      Defaults to the pull request's base sha.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  install:
    description: >-
      pip requirement spec for dorian. Pin a release ('dorian-vwp==0.1.*')
      or pass '.' to install the checked-out source.
    required: false
    default: dorian-vwp

runs:
  using: composite
  steps:
    - name: Install dorian
      shell: bash
      run: python -m pip install --quiet "${{ inputs.install }}"

    - name: Revalidate warranted claims
      id: revalidate
      shell: bash
      run: |
        set +e
        dorian sync
        dorian revalidate --since "${{ inputs.base }}" --format md > /tmp/dorian.md
        code=$?
        echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
        echo "dorian revalidate exited ${code}"
        cat /tmp/dorian.md
        exit 0

    - name: Sticky PR comment (update-or-create)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ -z "${PR_NUMBER}" ]; then
          echo "not a pull_request event; skipping comment"
          exit 0
        fi
        # silence on zero-affected: skip when the body is empty (usage/infra
        # failure wrote nothing) or is the no-op sentinel
        if [ ! -s /tmp/dorian.md ] || grep -qx "dorian: no warranted claims affected." /tmp/dorian.md; then
          echo "no warranted claims affected; skipping comment"
          exit 0
        fi
        # needs permissions: contents: read, pull-requests: write
        comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate --jq '[.[] | select(.body | contains("<!-- dorian -->"))][0].id // empty')
        if [ -n "${comment_id}" ]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -F body=@/tmp/dorian.md > /dev/null
          echo "updated comment ${comment_id}"
        else
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@/tmp/dorian.md > /dev/null
          echo "created comment"
        fi

    - name: Map exit code to step outcome
      shell: bash
      run: |
        set -euo pipefail
        code="${{ steps.revalidate.outputs.exit_code }}"
        fail_on="${{ inputs.fail_on }}"
        case "${fail_on}" in
          revoked|degraded|never) ;;
          *) echo "::error::invalid fail_on '${fail_on}' (choose revoked|degraded|never)"; exit 1 ;;
        esac
        if [ "${fail_on}" = "never" ]; then
          echo "fail_on=never: exit ${code} reported, step succeeds"
          exit 0
        fi
        # usage/infra failures are never a verdict: fail loudly regardless of
        # fail_on (2 = usage, 5 = ERRORED-only checker infrastructure)
        case "${code}" in
          2|5) echo "::error::dorian could not produce a verdict (exit ${code}: usage/infra)"; exit 1 ;;
          4) echo "::error::warranted claims REVOKED (exit 4)"; exit 1 ;;
          3)
            if [ "${fail_on}" = "degraded" ]; then
              echo "::error::warranted claims DEGRADED (exit 3)"
              exit 1
            fi
            ;;
          0) ;;
          # any unrecognized exit is an infra failure, never a silent pass
          *) echo "::error::unexpected dorian exit ${code}"; exit 1 ;;
        esac
        echo "dorian verdict ok (exit ${code}, fail_on=${fail_on})"
