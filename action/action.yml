name: dorian revalidate
description: >-
  Re-check warranted claims touched by a pull request, post the result as a
  sticky PR comment, and gate the check on the revalidation verdict.
  Composite, stdlib-only: no third-party actions; requires the gh CLI
  (preinstalled on GitHub-hosted runners) and a full-history checkout
  (actions/checkout with fetch-depth: 0).

inputs:
  fail_on:
    description: >-
      When to fail the step: 'revoked' (fail only on exit 4), 'degraded'
      (fail on exits 3 or 4), or 'never' (always succeed). Usage/infra
      failures (exits 2 and 5) fail the step regardless of this setting,
      except under 'never' — see action/README.md.
    required: false
    default: revoked
  base:
    description: >-
      Git ref to revalidate against (passed to `dorian revalidate --since`).
      Defaults to the pull request's base sha.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  install:
    description: >-
      pip requirement spec for dorian. Pin a release ('dorian-vwp==0.6.*')
      or pass '.' to install the checked-out source.
    required: false
    default: dorian-vwp
  deny_exec:
    description: >-
      Refuse to RUN the executable checker families (C4 pytest, C5 shell)
      during revalidation: they ERROR instead of executing, so a blocked claim
      never silently passes. Set 'true' for untrusted or public-fork contexts.
      Default 'false' preserves today's behavior for trusted/internal repos.
      This is fail-closed, NOT a sandbox — see SECURITY.md.
    required: false
    default: "false"
  deny_shell:
    description: >-
      Narrower than deny_exec: block only C5 shell, still allow C4 pytest.
    required: false
    default: "false"
  checker_trust:
    description: >-
      Which sidecar a claim's checker SPEC is read from (the sources checked are
      always the PR head). 'head' (default) runs the checked-out spec — correct for
      trusted/internal repos. 'base' resolves each spec from the base ref, so a
      PR-added or PR-modified executable checker is never executed and a rewritten
      checker cannot self-attest a verdict — for public repos taking forked PRs.
      Fail-closed, NOT a sandbox: a base-approved pytest checker can still execute
      PR-head code. See docs/TRUSTED_BASE_ACTION_DESIGN.md.
    required: false
    default: head

runs:
  using: composite
  steps:
    - name: Install dorian
      shell: bash
      env:
        # inputs flow through env, never inline ${{ }} in the script: an
        # event-derived expression wired into an input (e.g. github.head_ref)
        # must not become shell syntax
        DORIAN_INSTALL: ${{ inputs.install }}
      run: python -m pip install --quiet "$DORIAN_INSTALL"

    - name: Revalidate warranted claims
      id: revalidate
      shell: bash
      env:
        DORIAN_BASE: ${{ inputs.base }}
        # deny-exec/deny-shell flow through the env fallback dorian already
        # honors; 'false' (the default) is non-truthy, so trusted repos are
        # unchanged. Set deny_exec: true for untrusted/fork PRs.
        DORIAN_DENY_EXEC: ${{ inputs.deny_exec }}
        DORIAN_DENY_SHELL: ${{ inputs.deny_shell }}
        # checker_trust=base resolves checker specs from the base ref so a
        # PR-authored executable checker never runs. 'head' (default) is unchanged.
        DORIAN_CHECKER_SOURCE: ${{ inputs.checker_trust }}
      run: |
        set +e
        dorian sync
        dorian revalidate --since "$DORIAN_BASE" --format md > /tmp/dorian.md
        code=$?
        echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
        echo "dorian revalidate exited ${code}"
        # PR-controlled checker details flow to the log: fence them so they
        # cannot emit workflow commands (::error::, ::add-mask::, ...)
        fence="dorian-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        echo "::stop-commands::${fence}"
        cat /tmp/dorian.md
        echo "::${fence}::"
        exit 0

    - name: Sticky PR comment (update-or-create)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ -z "${PR_NUMBER}" ]; then
          echo "not a pull_request event; skipping comment"
          exit 0
        fi
        # silence on zero-affected: skip when the body is empty (usage/infra
        # failure wrote nothing) or is the no-op sentinel
        if [ ! -s /tmp/dorian.md ] || grep -qx "dorian: no warranted claims affected." /tmp/dorian.md; then
          echo "no warranted claims affected; skipping comment"
          exit 0
        fi
        # needs permissions: contents: read, pull-requests: write
        # author filter: only adopt our own bot's comment, so a participant
        # pre-planting the marker cannot have their comment taken over
        comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- dorian -->")))][0].id // empty')
        if [ -n "${comment_id}" ]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -F body=@/tmp/dorian.md > /dev/null
          echo "updated comment ${comment_id}"
        else
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@/tmp/dorian.md > /dev/null
          echo "created comment"
        fi

    - name: Map exit code to step outcome
      shell: bash
      env:
        DORIAN_EXIT: ${{ steps.revalidate.outputs.exit_code }}
        DORIAN_FAIL_ON: ${{ inputs.fail_on }}
      run: |
        set -euo pipefail
        code="$DORIAN_EXIT"
        fail_on="$DORIAN_FAIL_ON"
        case "${fail_on}" in
          revoked|degraded|never) ;;
          *) echo "::error::invalid fail_on '${fail_on}' (choose revoked|degraded|never)"; exit 1 ;;
        esac
        if [ "${fail_on}" = "never" ]; then
          echo "fail_on=never: exit ${code} reported, step succeeds"
          exit 0
        fi
        # usage/infra failures are never a verdict: fail loudly regardless of
        # fail_on (2 = usage, 5 = ERRORED-only checker infrastructure)
        case "${code}" in
          2|5) echo "::error::dorian could not produce a verdict (exit ${code}: usage/infra)"; exit 1 ;;
          4) echo "::error::warranted claims REVOKED (exit 4)"; exit 1 ;;
          3)
            if [ "${fail_on}" = "degraded" ]; then
              echo "::error::warranted claims DEGRADED (exit 3)"
              exit 1
            fi
            ;;
          0) ;;
          # any unrecognized exit is an infra failure, never a silent pass
          *) echo "::error::unexpected dorian exit ${code}"; exit 1 ;;
        esac
        echo "dorian verdict ok (exit ${code}, fail_on=${fail_on})"
