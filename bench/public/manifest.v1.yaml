  - name: bandit
    url: https://github.com/PyCQA/bandit
    frozen_sha: 92ae8b82fb422a639f0ed8d99e96cea769594e08
    frozen_ref: "1.9.4"
    license: Apache-2.0
    public: true
    eligible: true
