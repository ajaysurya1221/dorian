    frozen_sha: 36bde6cba69d962b83be1d52fc65a0dce1cb4ebb
    frozen_ref: null            # no tags on the duckdb default branch; HEAD pinned
    license: Apache-2.0
    public: true
    eligible: true
    needs_exec: true            # C5 typed-data claims need `dbt build` to produce the local DuckDB
    setup:
      - pip install dbt-duckdb
      - dbt build
    claims: repos/jaffle_shop_duckdb/claims.json
    mutations: repos/jaffle_shop_duckdb/mutations.yaml
    notes: >-
      The only strong data-layer repo (C5 rowcount/schema against a local DuckDB), fully
      offline after build. Domain: data/dbt. needs_exec: true — skipped under --deny-exec.
      Claims not yet authored.

  - name: sigstore-python
    url: https://github.com/sigstore/sigstore-python
    frozen_sha: 4baa76f7b30ec416d4bba66defc325d5c36dfb20
    frozen_ref: "v4.3.0"
    license: NOASSERTION
    public: true
    eligible: false
    reason: >-
      GitHub's SPDX license detector returns NOASSERTION (license file not classified to a
      recognized SPDX id). SPDX is unconfirmed, so it is excluded from the eligible set
      pending a manual LICENSE review — not silently swapped. bandit is the verified
      Apache-2.0 security-domain subject instead.
