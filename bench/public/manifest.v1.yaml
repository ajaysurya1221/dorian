# Public real-repo micro-benchmark manifest (v1 candidate set)
#
# STATUS: candidate frozen SHAs — NO RESULTS. This file pins reproducible inputs; it is
# NOT executed evidence and must never be cited as validation. It expands the two-repo
# pre-registration in repos.public.json / docs/PUBLIC_BENCHMARK_PROTOCOL.md with the
# deep-research top-5 starter set (research/audit/DORIAN_V1_0_0RC1_DEEP_RESEARCH.md §8).
#
# Each frozen_sha was verified to exist via `gh api repos/<owner>/<repo>/tags` (tagged
# release commit, most stable frozen point) on 2026-06-16. Licenses are the GitHub SPDX
# id. A repo dorian cannot include cleanly is marked eligible:false with a reason — never
# silently swapped. Claims are draft / human-review-required until a human signs off; the
# harness reports NO_CLAIMS until then, never a fabricated number.
schema_version: 1
benchmark: public-repos
status: candidate-frozen-shas-no-results

repos:
  - name: humanize
    url: https://github.com/python-humanize/humanize
    frozen_sha: 2ddb5903cdc1c7e6eb6b083f4f99f73db50aecd9
    frozen_ref: "4.15.0"
    license: MIT
    public: true
    eligible: true
    needs_exec: false          # dorian C3 reads source; no install needed for structural claims
    setup: []
    claims: repos/humanize/claims.json
    mutations: repos/humanize/mutations.yaml
    notes: >-
      Small stable public API; py-signature:/py-const:/code: showcase. Read-only structural
      claims need no install. Domain: Python library API stability.

