[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorian-vwp"
version = "0.4.0"
description = "Validity warrants for AI-generated artifacts: your doc still looks perfect; its portrait doesn't."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ajay Surya Senthilrajan" }]
keywords = ["provenance", "validity", "claims", "ai-artifacts", "staleness"]
dependencies = []

[project.optional-dependencies]
extract = ["anthropic"]
data = ["duckdb"]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/dorian"
Repository = "https://github.com/ajaysurya1221/dorian"
Issues = "https://github.com/ajaysurya1221/dorian/issues"

[project.scripts]
dorian = "dorian.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dorian"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]
target-version = "py311"
extend-exclude = ["bench/real"]  # local real-repo benchmark data: clones + worktrees, never linted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: spawns a real pytest subprocess (deselect with -m 'not slow')"]
