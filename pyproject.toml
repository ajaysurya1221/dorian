[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "dorian-vwp"
version = "1.4.1"
description = "Turn claims about code into executable checks and revocable warrants, re-checked as code changes with no model calls during verification."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ajay Surya Senthilrajan" }]
keywords = ["provenance", "validity", "claims", "ai-artifacts", "staleness"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
extract = ["anthropic"]
data = ["duckdb"]

[project.urls]
Homepage = "https://github.com/ajaysurya1221/dorian"
Repository = "https://github.com/ajaysurya1221/dorian"
Issues = "https://github.com/ajaysurya1221/dorian/issues"

[project.scripts]
dorian = "dorian.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dorian"]
# defense in depth: never package editor/cloud-sync duplicate artifacts ("foo 2.py"),
# even from a dirty working tree (they are also git-ignored, so never tracked)
exclude = ["**/* 2.py"]

[tool.hatch.build.targets.sdist]
# keep the sdist lean: no hero images, benchmark data, archived notes, tests, or lockfile
exclude = ["/docs/assets/*.png", "/bench/", "/archive/", "/tests/", "/uv.lock"]

# PyPI long description: README.md with every repository-relative link and image rewritten to
# version-pinned GitHub URLs, so the PyPI page resolves them. README.md itself keeps relative
# paths for GitHub. Pure anchors (#...), absolute URLs and fenced code blocks are left alone
# (each pattern ends in a lookahead that matches only outside ``` fences that open a line).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# the <picture> hero becomes one <img> (the light SVG); PyPI drops <source srcset>
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<picture>\s*<source [^>]*>\s*(<img [^>]*>)\s*</picture>(?=(?:(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```)*(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*\Z)'
replacement = '\1'

# raw HTML image sources -> version-pinned raw files
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?![A-Za-z][A-Za-z0-9+.-]*:|//|#)(?:\./)?([^"]+)"(?=(?:(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```)*(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*\Z)'
replacement = '\1="https://raw.githubusercontent.com/ajaysurya1221/dorian/v$HFPR_VERSION/\2"'

# raw HTML links -> version-pinned GitHub pages
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?![A-Za-z][A-Za-z0-9+.-]*:|//|#)(?:\./)?([^"]+)"(?=(?:(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```)*(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*\Z)'
replacement = 'href="https://github.com/ajaysurya1221/dorian/blob/v$HFPR_VERSION/\1"'

# Markdown images -> version-pinned raw files
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?![A-Za-z][A-Za-z0-9+.-]*:|//|#)(?:\./)?([^)\s]+)\)(?=(?:(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```)*(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*\Z)'
replacement = '![\1](https://raw.githubusercontent.com/ajaysurya1221/dorian/v$HFPR_VERSION/\2)'

# Markdown links to directories -> version-pinned tree pages
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![A-Za-z][A-Za-z0-9+.-]*:|//|#)(?:\./)?([^)\s]*/)\)(?=(?:(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```)*(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*\Z)'
replacement = '](https://github.com/ajaysurya1221/dorian/tree/v$HFPR_VERSION/\1)'

# Markdown links to files (anchors kept) -> version-pinned blob pages
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![A-Za-z][A-Za-z0-9+.-]*:|//|#)(?:\./)?([^)\s]+)\)(?=(?:(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*(?m:^)[ ]{0,3}```)*(?:(?!(?m:^)[ ]{0,3}```)[\s\S])*\Z)'
replacement = '](https://github.com/ajaysurya1221/dorian/blob/v$HFPR_VERSION/\1)'

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]
target-version = "py311"
extend-exclude = ["bench/real"]  # local real-repo benchmark data: clones + worktrees, never linted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: heavy test (benchmark run, wheel build, or real pytest subprocess) — deselect with -m 'not slow'",
]

[tool.bandit]
# dorian is a deterministic checker-EXECUTION tool: by design (and only through the
# fail-closed deny-exec/deny-shell policy in src/dorian/policy.py — see
# docs/SECURITY_BOUNDARY.md) it spawns subprocesses (C4 `pytest:`, `git`) and runs
# read-only, authorizer-gated SQL (C5 data checks). The checks below flag exactly those
# reviewed-by-design primitives, so they are excluded here; bandit still gates every OTHER
# vulnerability class (eval/exec, pickle, weak crypto, yaml.load, requests verify=False, …).
# The real execution control is policy.py, covered by tests/test_deny_exec_policy.py.
skips = [
    "B101",  # assert_used: asserts are internal invariants, not access control
    "B105",  # hardcoded_password: false positive — "PASS" is a Verdict label
    "B404",  # import subprocess: required to run the gated pytest/git primitives
    "B603",  # subprocess_without_shell: list-form spawn (the SAFE, non-shell form)
    "B607",  # start_process_with_partial_path: bare `python`/`git` via PATH, by design
    "B602",  # subprocess shell=True: the GATED C5 `shell:` checker (deny-shell/deny-exec)
    "B604",  # function shell=True: same gated shell path via run_readonly
    "B608",  # hardcoded_sql: read-only, authorizer-gated SQL in the data-check suggester
]
